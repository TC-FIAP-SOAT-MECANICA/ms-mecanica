server:
  servlet:
    context-path: /api/v1
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: oficina-mecanica
  profiles:
    # Sem perfil informado, usa o H2 local (application-local.yml). Para Postgres: perfil "postgres".
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Cria/atualiza as tabelas na inicialização executando src/main/resources/db/migration (V1, V2, V3...)
    enabled: true
  mvc:
    problemdetails:
      enabled: true

logging:
  file:
    name: logs/oficina-mecanica.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
  pattern:
    level: "%5p [%X{requestId:-}]"
  loki:
    url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /api/v1/oficina-mecanica-contract.yaml
